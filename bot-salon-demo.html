<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salón Belleza Luna – WhatsApp bot demo</title>
<style>
  :root{
    --wa-green-dark:#075E54;
    --wa-green-header:#008069;
    --wa-bubble-out:#D9FDD3;
    --wa-bubble-in:#FFFFFF;
    --wa-bg:#EFE7DD;
    --wa-chip:#FFFFFF;
    --wa-chip-text:#008069;
    --wa-check:#53BDEB;
    --ink:#111B21;
    --ink-soft:#667781;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    background:#0b141a;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:12px;
  }
  .phone{
    width:100%;
    max-width:420px;
    height:min(780px, 96vh);
    background:var(--wa-bg);
    border-radius:22px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    box-shadow:0 20px 60px rgba(0,0,0,.5);
    position:relative;
  }
  /* header */
  .header{
    background:var(--wa-green-header);
    color:#fff;
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 14px;
    flex-shrink:0;
    z-index:5;
  }
  .avatar{
    width:40px;height:40px;border-radius:50%;
    background:linear-gradient(135deg,#f6c1cf,#b06ab3);
    display:flex;align-items:center;justify-content:center;
    font-size:20px;flex-shrink:0;
  }
  .header .info{line-height:1.25;min-width:0;}
  .header .name{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .header .status{font-size:12px;opacity:.85;}
  .header .icons{margin-left:auto;display:flex;gap:18px;font-size:17px;opacity:.9;}
  /* chat */
  .chat{
    flex:1;
    overflow-y:auto;
    padding:14px 12px 8px;
    background:
      radial-gradient(circle at 20% 30%, rgba(255,255,255,.35) 0 2px, transparent 2px),
      radial-gradient(circle at 70% 60%, rgba(255,255,255,.3) 0 1.5px, transparent 1.5px),
      var(--wa-bg);
    background-size:110px 110px, 90px 90px, auto;
    display:flex;
    flex-direction:column;
    gap:6px;
    scroll-behavior:smooth;
  }
  .day-pill{
    align-self:center;
    background:#fff;
    color:var(--ink-soft);
    font-size:12px;
    padding:4px 12px;
    border-radius:8px;
    box-shadow:0 1px 1px rgba(0,0,0,.08);
    margin-bottom:4px;
  }
  .msg{
    max-width:82%;
    padding:7px 10px 6px;
    border-radius:10px;
    font-size:14.5px;
    line-height:1.35;
    color:var(--ink);
    position:relative;
    box-shadow:0 1px 1px rgba(0,0,0,.08);
    white-space:pre-line;
    animation:pop .18s ease-out;
  }
  @keyframes pop{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  .msg.in{background:var(--wa-bubble-in);align-self:flex-start;border-top-left-radius:2px;}
  .msg.out{background:var(--wa-bubble-out);align-self:flex-end;border-top-right-radius:2px;}
  .meta{
    display:inline-flex;align-items:center;gap:3px;
    font-size:11px;color:var(--ink-soft);
    float:right;margin:6px -2px -2px 8px;
  }
  .ticks{color:var(--wa-check);font-size:12px;letter-spacing:-3px;}
  /* typing */
  .typing{
    background:var(--wa-bubble-in);
    align-self:flex-start;
    border-radius:10px;border-top-left-radius:2px;
    padding:12px 14px;
    display:flex;gap:4px;
    box-shadow:0 1px 1px rgba(0,0,0,.08);
  }
  .typing span{
    width:7px;height:7px;border-radius:50%;
    background:#9aa5ab;
    animation:blink 1.2s infinite;
  }
  .typing span:nth-child(2){animation-delay:.2s;}
  .typing span:nth-child(3){animation-delay:.4s;}
  @keyframes blink{0%,60%,100%{opacity:.3;}30%{opacity:1;}}
  /* quick replies */
  .chips{
    display:flex;flex-wrap:wrap;gap:8px;
    align-self:flex-start;
    max-width:88%;
    padding:2px 0 4px;
    animation:pop .18s ease-out;
  }
  .chip{
    background:var(--wa-chip);
    color:var(--wa-chip-text);
    border:1px solid rgba(0,128,105,.35);
    border-radius:20px;
    padding:8px 14px;
    font-size:14px;
    font-weight:500;
    cursor:pointer;
    box-shadow:0 1px 1px rgba(0,0,0,.06);
    transition:background .15s, transform .1s;
  }
  .chip:hover{background:#e8f6f2;}
  .chip:active{transform:scale(.96);}
  /* input bar */
  .inputbar{
    display:flex;align-items:center;gap:8px;
    padding:8px 10px;
    background:#F0F2F5;
    flex-shrink:0;
  }
  .inputbar input{
    flex:1;
    border:none;outline:none;
    background:#fff;
    border-radius:20px;
    padding:10px 16px;
    font-size:14.5px;
    color:var(--ink);
  }
  .send{
    width:42px;height:42px;border-radius:50%;
    background:var(--wa-green-header);
    border:none;color:#fff;font-size:17px;
    cursor:pointer;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    transition:transform .1s;
  }
  .send:active{transform:scale(.92);}
  /* owner panel */
  .owner-toggle{
    position:absolute;
    top:64px;right:10px;
    background:#111B21;
    color:#fff;
    border:none;
    border-radius:16px;
    font-size:11.5px;
    padding:6px 11px;
    cursor:pointer;
    opacity:.85;
    z-index:6;
  }
  .owner{
    position:absolute;
    top:100px;right:10px;left:10px;
    background:#fff;
    border-radius:14px;
    box-shadow:0 10px 30px rgba(0,0,0,.25);
    padding:14px;
    z-index:7;
    display:none;
    max-height:60%;
    overflow-y:auto;
  }
  .owner.open{display:block;animation:pop .18s ease-out;}
  .owner h3{font-size:14px;color:var(--ink);margin-bottom:2px;}
  .owner .sub{font-size:12px;color:var(--ink-soft);margin-bottom:10px;}
  .booking{
    border-left:3px solid var(--wa-green-header);
    background:#F0FAF7;
    border-radius:0 8px 8px 0;
    padding:8px 10px;
    font-size:13px;
    color:var(--ink);
    margin-bottom:8px;
    line-height:1.4;
  }
  .empty{font-size:13px;color:var(--ink-soft);font-style:italic;}
  .demo-note{
    text-align:center;
    color:#8696a0;
    font-size:11px;
    padding:6px 0 2px;
    background:#F0F2F5;
  }
  /* language switch */
  .lang{position:fixed; top:12px; right:12px; z-index:20; display:inline-flex; background:#1f2c33; border-radius:20px; padding:3px;}
  .lang button{font:600 12px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; letter-spacing:.04em; color:#aebac1; background:transparent; border:0; border-radius:16px; padding:7px 11px; cursor:pointer;}
  .lang button.on{background:#008069; color:#fff;}
  @media (max-width:480px){ .lang{top:auto; bottom:12px; right:50%; transform:translateX(50%);} body{align-items:flex-start;} .phone{height:calc(100vh - 80px); height:calc(100dvh - 80px);} }
</style>
</head>
<body>
<div class="lang" role="group" aria-label="Language"><button type="button" data-l="en" class="on">EN</button><button type="button" data-l="es">ES</button></div>
<div class="phone">
  <div class="header">
    <div class="avatar">💅</div>
    <div class="info">
      <div class="name">Salón Belleza Luna</div>
      <div class="status" id="status">online</div>
    </div>
    <div class="icons"><span>📹</span><span>📞</span><span>⋮</span></div>
  </div>

  <button class="owner-toggle" id="ownerToggle">💼 What the owner sees</button>
  <div class="owner" id="ownerPanel">
    <h3 id="ownerTitle">Salon calendar (Google Calendar)</h3>
    <div class="sub" id="ownerSub"></div>
    <div id="bookings"></div>
  </div>

  <div class="chat" id="chat"></div>

  <div class="inputbar">
    <input id="input" type="text" placeholder="Type a message" autocomplete="off">
    <button class="send" id="sendBtn" aria-label="Send">➤</button>
  </div>
  <div class="demo-note" id="demoNote"></div>
</div>

<script>
(function(){

function getLang(){ try{ return new URLSearchParams(location.search).get('lang')==='es' ? 'es' : 'en'; }catch(e){ return 'en'; } }
function putLang(l){ try{ var u=new URL(location.href); if(l==='es') u.searchParams.set('lang','es'); else u.searchParams.delete('lang'); history.replaceState(null,'',u.pathname+u.search+u.hash); }catch(e){} }

  const T = {
    en:{
      title:'Salón Belleza Luna – WhatsApp bot demo',
      online:'online', typing:'typing…', today:'Today', placeholder:'Type a message', send:'Send',
      ownerBtn:'💼 What the owner sees', ownerTitle:'Salon calendar (Google Calendar)',
      ownerSub:'The bot adds every confirmed booking here automatically. The owner just opens the calendar in the morning.',
      empty:'No bookings yet. Make one in the chat and it will appear here.',
      demoNote:'Demo simulator · this is how the bot works in real WhatsApp',
      client:'Client', via:'via WhatsApp bot',
      services:[
        {label:'Manicure – 18€', name:'Manicure', price:'18€'},
        {label:'Pedicure – 25€', name:'Pedicure', price:'25€'},
        {label:'Mani + Pedi – 38€', name:'Manicure + Pedicure', price:'38€'},
        {label:'Gel nails – 35€', name:'Gel nails', price:'35€'}
      ],
      days:['Thursday','Friday','Saturday'],
      menu:['📅 Book an appointment','💅 See prices','📍 Address & hours'],
      opening:'Hi! I\'d like some information 😊',
      greet:'Hi! 👋 I\'m the assistant of Salón Belleza Luna.\n\nI can book an appointment for you, tell you about our prices or give you our address. How can I help?',
      askService:'Great! Which service would you like? 💅',
      prices:'Here are our prices:\n\n💅 Manicure – 18€\n🦶 Pedicure – 25€\n✨ Mani + Pedi – 38€\n💎 Gel nails – 35€\n\nWould you like to book an appointment?',
      yesBook:'📅 Yes, book', notNow:'Not now',
      address:'📍 We\'re at Calle de la Luna 12, Valencia.\n\n🕐 Opening hours:\nMon–Fri: 10:00–20:00\nSaturday: 10:00–15:00\nSunday: closed\n\nCan I help with anything else?',
      goodChoice:'Good choice! Which day works for you?',
      slots:function(d){ return 'On ' + d + ' I have these free slots:'; },
      askName:'Perfect! To confirm the appointment, what\'s your name? ✍️',
      nameAgain:'Could you tell me your name again, please? 🙂',
      confirm:function(n,s,p,d,t){ return '✅ All set, ' + n + '!\n\nYour appointment:\n💅 ' + s + ' (' + p + ')\n📅 ' + d + ' at ' + t + '\n📍 Calle de la Luna 12\n\nI\'ll send you a reminder the day before. See you soon! 💖'; },
      another:'📅 Another booking', thanksBtn:'Thanks 🙌',
      noProblem:'No problem! Write to me whenever you like 😊',
      thanksReply:'Thank you! 💖 Have a lovely day.',
      welcome:'You\'re welcome! 💖 I\'m here if you need anything else.',
      cancel:'Of course – to cancel or change your appointment, tell me your name and the date and I\'ll sort it out right away 🙂',
      fallback:'Sorry, I didn\'t quite get that 🙈 Can I help you with one of these options?',
      at:'at'
    },
    es:{
      title:'Salón Belleza Luna – Demo bot de WhatsApp',
      online:'en línea', typing:'escribiendo…', today:'Hoy', placeholder:'Escribe un mensaje', send:'Enviar',
      ownerBtn:'💼 Lo que ve la dueña', ownerTitle:'Calendario del salón (Google Calendar)',
      ownerSub:'El bot añade aquí automáticamente cada reserva confirmada. La dueña solo abre el calendario por la mañana.',
      empty:'Todavía no hay reservas. Haz una en el chat y aparecerá aquí.',
      demoNote:'Simulador demo · así funciona el bot en WhatsApp real',
      client:'Cliente', via:'vía bot de WhatsApp',
      services:[
        {label:'Manicura – 18€', name:'Manicura', price:'18€'},
        {label:'Pedicura – 25€', name:'Pedicura', price:'25€'},
        {label:'Mani + Pedi – 38€', name:'Manicura + Pedicura', price:'38€'},
        {label:'Uñas de gel – 35€', name:'Uñas de gel', price:'35€'}
      ],
      days:['Jueves','Viernes','Sábado'],
      menu:['📅 Reservar cita','💅 Ver precios','📍 Dirección y horario'],
      opening:'¡Hola! Quería información 😊',
      greet:'¡Hola! 👋 Soy el asistente de Salón Belleza Luna.\n\nPuedo reservarte una cita, darte información sobre los precios o indicarte nuestra dirección. ¿En qué te ayudo?',
      askService:'¡Genial! ¿Qué servicio te gustaría? 💅',
      prices:'Estos son nuestros precios:\n\n💅 Manicura – 18€\n🦶 Pedicura – 25€\n✨ Mani + Pedi – 38€\n💎 Uñas de gel – 35€\n\n¿Quieres reservar una cita?',
      yesBook:'📅 Sí, reservar', notNow:'Ahora no',
      address:'📍 Estamos en Calle de la Luna 12, Valencia.\n\n🕐 Horario:\nLun–Vie: 10:00–20:00\nSábado: 10:00–15:00\nDomingo: cerrado\n\n¿Te ayudo con algo más?',
      goodChoice:'¡Buena elección! ¿Qué día te viene bien?',
      slots:function(d){ return 'Para el ' + d.toLowerCase() + ' tengo estos huecos libres:'; },
      askName:'¡Perfecto! Para confirmar la cita, ¿me dices tu nombre? ✍️',
      nameAgain:'¿Me repites tu nombre, porfa? 🙂',
      confirm:function(n,s,p,d,t){ return '✅ ¡Listo, ' + n + '!\n\nTu cita:\n💅 ' + s + ' (' + p + ')\n📅 ' + d + ' a las ' + t + '\n📍 Calle de la Luna 12\n\nTe enviaré un recordatorio el día antes. ¡Hasta pronto! 💖'; },
      another:'📅 Otra reserva', thanksBtn:'Gracias 🙌',
      noProblem:'¡Sin problema! Escríbeme cuando quieras 😊',
      thanksReply:'¡A ti! 💖 Que tengas un día precioso.',
      welcome:'¡A ti! 💖 Aquí estoy si necesitas algo más.',
      cancel:'Claro, para cancelar o cambiar tu cita dime tu nombre y la fecha, y lo gestiono al momento 🙂',
      fallback:'Perdona, no te he entendido bien 🙈 ¿Te ayudo con alguna de estas opciones?',
      at:'a las'
    }
  };
  // the same time slots in both languages, keyed by day position
  const TIMES = [['10:00','13:30','17:00'],['11:00','16:00','18:30'],['10:30','12:00']];

  let L = getLang();
  const t = () => T[L];

  const chat = document.getElementById('chat');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('sendBtn');
  const statusEl = document.getElementById('status');
  const ownerToggle = document.getElementById('ownerToggle');
  const ownerPanel = document.getElementById('ownerPanel');
  const bookingsEl = document.getElementById('bookings');

  let state, timers = [];
  function later(fn, ms){ const id = setTimeout(fn, ms); timers.push(id); return id; }

  function now(){
    const d = new Date();
    return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
  }
  function scroll(){ chat.scrollTop = chat.scrollHeight; }
  function escapeHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  function addMsg(text, dir){
    const m = document.createElement('div');
    m.className = 'msg ' + dir;
    m.innerHTML = escapeHtml(text) +
      '<span class="meta">' + now() + (dir==='out' ? ' <span class="ticks">✓✓</span>' : '') + '</span>';
    chat.appendChild(m);
    scroll();
  }

  let typingEl = null;
  function showTyping(){
    statusEl.textContent = t().typing;
    typingEl = document.createElement('div');
    typingEl.className = 'typing';
    typingEl.innerHTML = '<span></span><span></span><span></span>';
    chat.appendChild(typingEl);
    scroll();
  }
  function hideTyping(){
    statusEl.textContent = t().online;
    if(typingEl){ typingEl.remove(); typingEl = null; }
  }
  function botSay(text, chips, delay){
    showTyping();
    later(function(){
      hideTyping();
      addMsg(text, 'in');
      if(chips && chips.length){ addChips(chips); }
    }, delay || 900);
  }

  let chipsEl = null;
  function addChips(options){
    removeChips();
    chipsEl = document.createElement('div');
    chipsEl.className = 'chips';
    options.forEach(function(opt){
      const b = document.createElement('button');
      b.className = 'chip';
      b.textContent = opt.label;
      b.addEventListener('click', function(){ handleUser(opt.value || opt.label, opt.label); });
      chipsEl.appendChild(b);
    });
    chat.appendChild(chipsEl);
    scroll();
  }
  function removeChips(){ if(chipsEl){ chipsEl.remove(); chipsEl = null; } }

  function mainMenuChips(){
    const m = t().menu;
    return [ {label:m[0], value:'__reservar'}, {label:m[1], value:'__precios'}, {label:m[2], value:'__direccion'} ];
  }
  function startBooking(){
    state.step = 'service';
    botSay(t().askService, t().services.map(function(s, i){ return {label:s.label, value:'__srv:'+i}; }));
  }
  function pricesMsg(){
    botSay(t().prices, [{label:t().yesBook, value:'__reservar'},{label:t().notNow, value:'__no'}]);
  }
  function addressMsg(){ botSay(t().address, mainMenuChips()); }

  function confirmBooking(name){
    const srv = t().services[state.service], day = t().days[state.day];
    state.bookings.push({ name:name, service:state.service, day:state.day, time:state.time });
    renderBookings();
    botSay(t().confirm(name, srv.name, srv.price, day, state.time),
      [{label:t().another, value:'__reservar'},{label:t().thanksBtn, value:'__gracias'}], 1100);
    state.step = 'idle';
    state.service = state.day = state.time = null;
    ownerToggle.style.background = '#008069';
    later(function(){ ownerToggle.style.background = '#111B21'; }, 1600);
  }

  function renderBookings(){
    if(!state.bookings.length){
      bookingsEl.innerHTML = '<div class="empty">' + t().empty + '</div>';
      return;
    }
    bookingsEl.innerHTML = state.bookings.map(function(b){
      const srv = t().services[b.service];
      return '<div class="booking"><b>' + t().days[b.day] + ' ' + b.time + '</b> – ' + srv.name +
        ' (' + srv.price + ')<br>' + t().client + ': ' + escapeHtml(b.name) + ' · ' + t().via + ' 🤖</div>';
    }).join('');
  }

  function fallback(){ botSay(t().fallback, mainMenuChips()); }

  function handleFreeText(text){
    const s = text.toLowerCase();
    if(/(hola|buenas|hey|hi\b|hello)/.test(s)){ greet(); return; }
    if(/(reserv|cita|hueco|apunt|book|appointment|slot)/.test(s)){ startBooking(); return; }
    if(/(precio|cuánto|cuanto|tarifa|coste|price|cost|how much)/.test(s)){ pricesMsg(); return; }
    if(/(direcci|dónde|donde|horario|abr|ubicaci|address|where|hours|open)/.test(s)){ addressMsg(); return; }
    if(/(gracias|perfecto|vale|ok|genial|thank|great|perfect)/.test(s)){ botSay(t().welcome, mainMenuChips()); return; }
    if(/(cancel|anular|change|cambiar)/.test(s)){ botSay(t().cancel); return; }
    fallback();
  }

  function handleUser(value, label){
    removeChips();
    addMsg(label || value, 'out');
    if(value === '__reservar'){ startBooking(); return; }
    if(value === '__precios'){ pricesMsg(); return; }
    if(value === '__direccion'){ addressMsg(); return; }
    if(value === '__no'){ botSay(t().noProblem, mainMenuChips()); return; }
    if(value === '__gracias'){ botSay(t().thanksReply, mainMenuChips()); return; }
    if(value.indexOf('__srv:') === 0){
      state.service = +value.slice(6);
      state.step = 'day';
      botSay(t().goodChoice, t().days.map(function(d, i){ return {label:'📅 ' + d, value:'__day:'+i}; }));
      return;
    }
    if(value.indexOf('__day:') === 0){
      state.day = +value.slice(6);
      state.step = 'time';
      botSay(t().slots(t().days[state.day]), TIMES[state.day].map(function(x){ return {label:'🕐 ' + x, value:'__time:'+x}; }));
      return;
    }
    if(value.indexOf('__time:') === 0){
      state.time = value.slice(7);
      state.step = 'name';
      botSay(t().askName);
      return;
    }
    if(state.step === 'name'){
      const name = value.trim();
      if(name.length < 2){ botSay(t().nameAgain); return; }
      confirmBooking(name.charAt(0).toUpperCase() + name.slice(1));
      return;
    }
    handleFreeText(value);
  }

  function greet(){ botSay(t().greet, mainMenuChips(), 700); }

  // static texts + a fresh conversation in the current language
  function start(){
    timers.forEach(clearTimeout); timers = [];
    typingEl = null; chipsEl = null;
    state = { step:'idle', service:null, day:null, time:null, bookings:[] };
    document.documentElement.lang = L;
    document.title = t().title;
    statusEl.textContent = t().online;
    ownerToggle.textContent = t().ownerBtn;
    document.getElementById('ownerTitle').textContent = t().ownerTitle;
    document.getElementById('ownerSub').textContent = t().ownerSub;
    document.getElementById('demoNote').textContent = t().demoNote;
    input.placeholder = t().placeholder;
    sendBtn.setAttribute('aria-label', t().send);
    document.querySelectorAll('.lang button').forEach(function(b){ b.classList.toggle('on', b.getAttribute('data-l') === L); });
    renderBookings();
    chat.innerHTML = '<div class="day-pill">' + t().today + '</div>';
    later(function(){ addMsg(t().opening, 'out'); greet(); }, 600);
  }

  sendBtn.addEventListener('click', function(){
    const v = input.value.trim();
    if(!v) return;
    input.value = '';
    handleUser(v);
  });
  input.addEventListener('keydown', function(e){ if(e.key === 'Enter'){ sendBtn.click(); } });
  ownerToggle.addEventListener('click', function(){ ownerPanel.classList.toggle('open'); });
  document.addEventListener('click', function(e){
    if(ownerPanel.classList.contains('open') && !ownerPanel.contains(e.target) && e.target !== ownerToggle){
      ownerPanel.classList.remove('open');
    }
  });
  document.querySelectorAll('.lang button').forEach(function(b){
    b.addEventListener('click', function(){
      const l = b.getAttribute('data-l'); if(l === L) return;
      L = l; putLang(L); start();
    });
  });

  start();
})();
</script>
</body>
</html>
